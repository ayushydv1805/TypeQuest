name: Build Windows Downloads

on:
  push:
    branches: [fix/login-persistence]
    paths:
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "electron/**"
      - "src/**"
      - "public/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typequest-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency security
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run typing regression tests
        run: npm test

      - name: Build Windows installer and portable app
        run: npm run desktop:dist

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: typequest-windows-downloads
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
