name: Build Android APK

on:
  push:
    branches: [fix/login-persistence]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typequest-android-build
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Check dependency security
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Build the web app
        run: npm run build

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate the Android project
        run: npx cap add android

      - name: Copy web assets into Android
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: typequest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
