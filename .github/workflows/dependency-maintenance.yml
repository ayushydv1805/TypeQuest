name: Repair npm security advisories

on:
  push:
    branches: [fix/login-persistence]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-maintenance.yml"

permissions:
  contents: write

concurrency:
  group: npm-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compatible security updates
        run: npm audit fix --package-lock-only
      - name: Install the updated lockfile
        run: npm ci
      - name: Verify no high-severity advisories remain
        run: npm audit --audit-level=high
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable npm dependency versions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
